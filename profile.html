<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile · National Engineering College</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <header class="top-bar">
    <div class="top-bar-brand">
      <div class="seal-sm">NEC</div>
      <div>
        <p class="brand-name">National Engineering College</p>
        <p class="brand-sub">Recruitment Portal · Staff Profile</p>
      </div>
    </div>
    <p class="signed-in-as" id="signedInAs"></p>
  </header>

  <main class="wrap">

    <!-- Progress stepper : 4 tabs -->
    <div class="stepper" id="stepper">
      <div class="step-node is-active" data-step="1">
        <div class="step-circle">1</div>
        <div class="step-label">Personal Info</div>
      </div>
      <div class="step-line" data-line="1"></div>
      <div class="step-node" data-step="2">
        <div class="step-circle">2</div>
        <div class="step-label">Education &amp; Documents</div>
      </div>
      <div class="step-line" data-line="2"></div>
      <div class="step-node" data-step="3">
        <div class="step-circle">3</div>
        <div class="step-label">Experience</div>
      </div>
      <div class="step-line" data-line="3"></div>
      <div class="step-node" data-step="4">
        <div class="step-circle">4</div>
        <div class="step-label">Certifications &amp; NPTEL</div>
      </div>
    </div>

    <div class="banner" id="banner"></div>

    <!-- Each tab's markup lives in its own file and is fetched in here at
       load time by profileApp.js:
         panel1 <- tab_personal.html
         panel2 <- tab_education.html
         panel3 <- tab_experience.html
         panel4 <- tab_certifications.html
         panelDone <- tab_done.html -->
    <div id="panel1-mount"></div>
    <div id="panel2-mount"></div>
    <div id="panel3-mount"></div>
    <div id="panel4-mount"></div>
    <div id="panelDone-mount"></div>

  </main>

  <script src="profileCore.js"></script>
  <script src="profilePersonal.js"></script>
  <script src="profileEducation.js"></script>
  <script src="profileExperience.js"></script>
  <script src="profileCertifications.js"></script>
  <script src="profileApp.js"></script>
</body>

</html>

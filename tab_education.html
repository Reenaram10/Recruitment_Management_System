<section class="panel" id="panel2">
  <div class="panel-head">
    <h1>Education &amp; Documents</h1>

      and ID proof upload are optional.</p>

  <!-- 10th -->
  <fieldset class="edu-block" id="tenthBlock">
    <legend>10th Standard *</legend>
    <div class="grid-5">
      <div class="field">
        <label for="tenthPercentage">Percentage *</label>
        <input type="number" id="tenthPercentage" min="0" max="100" step="0.01" placeholder="e.g. 85.4">
        <div class="field-error" id="tenthPercentageError"></div>
      </div>
      <div class="field">
        <label for="tenthYear">Year of Passing *</label>
        <input type="number" id="tenthYear" min="1970" max="2026" placeholder="e.g. 2010">
        <div class="field-error" id="tenthYearError"></div>
      </div>
      <div class="field">
        <label for="tenthMedium">Medium of Study *</label>
        <select id="tenthMedium">
          <option value="" disabled selected>Select medium</option>
          <option>English</option>
          <option>Tamil</option>
          <option>Other</option>
        </select>
        <div class="field-error" id="tenthMediumError"></div>
      </div>
      <div class="field">
        <label for="tenthAttempt">First Attempt *</label>
        <select id="tenthAttempt">
          <option value="" disabled selected>Select</option>
          <option>Yes</option>
          <option>No</option>

      </div>
      <div class="field">
        <label for="tenthClass">First Class *</label>

          <option value="" disabled selected>Select</option>
          <option>Yes</option>
          <option>No</option>
        </select>
        <div class="field-error" id="tenthClassError"></div>
      </div>
    </div>
    <div class="field" id="fld-tenthMediumOther" style="display:none;">
      <label for="tenthMediumOther">Please specify medium *</label>
      <input type="text" id="tenthMediumOther" placeholder="Type medium">
      <div class="field-error" id="tenthMediumOtherError"></div>
    </div>
    <div class="grid-2" style="margin-top:0.75rem;">
      <div class="field" style="grid-column: span 2;">
        <label for="tenthInstitution">10th School / Institution Name *</label>
        <input type="text" id="tenthInstitution"
          placeholder="Type your 10th school name (e.g. Govt Higher Secondary School, Kovilpatti)..."
          autocomplete="off">
        <div class="field-error" id="tenthInstitutionError"></div>
      </div>
    </div>
    <div class="field file-field" id="fld-tenthDoc">

      <input type="file" id="tenthDoc" accept=".pdf,.jpg,.jpeg,.png" class="file-input">

    <div class="grid-2" style="margin-top:0.75rem;">
      <div class="field">
        <label for="phdPublicationsDuring">No. of Publications During Ph.D</label>
        <input type="number" id="phdPublicationsDuring" min="0" placeholder="e.g. 4">
        <div class="field-error" id="phdPublicationsDuringError"></div>
      </div>
      <div class="field">
        <label for="phdPublicationsPost">No. of Publications Post Ph.D</label>
        <input type="number" id="phdPublicationsPost" min="0" placeholder="e.g. 6">
        <div class="field-error" id="phdPublicationsPostError"></div>
      </div>
    </div>

    <div class="field" style="margin-top:0.75rem;">
      <label for="phdPostExperience">Post Ph.D Experience (Details / Years)</label>
      <input type="text" id="phdPostExperience" placeholder="e.g. 3.5 Years Post-Doctoral / Teaching Experience">
      <div class="field-error" id="phdPostExperienceError"></div>
    </div>

    <div class="field file-field" id="fld-phdDoc" style="margin-top:0.75rem;">
      <label for="phdDoc">Ph.D Certificate <span class="hint">(optional)</span></label>
      <input type="file" id="phdDoc" accept=".pdf,.jpg,.jpeg,.png" class="file-input">
      <label for="phdDoc" class="file-btn">Choose file <span class="file-name" id="phdDocName">No file
          selected</span></label>
      <div class="field-error" id="phdDocError"></div>
    </div>
  </fieldset>

  <h2 class="section-title">Other Documents</h2>
  <div class="field file-field" id="fld-idProofDoc" style="max-width: 420px;">
    <label for="idProofDoc">ID Proof (Aadhaar / Passport) <span class="hint">(optional)</span></label>
    <input type="file" id="idProofDoc" accept=".pdf,.jpg,.jpeg,.png" class="file-input">
    <label for="idProofDoc" class="file-btn">Choose file <span class="file-name" id="idProofDocName">No file
        selected</span></label>
    <div class="field-error" id="idProofDocError"></div>
  </div>

  <div class="panel-actions">
    <button type="button" class="btn-ghost" id="backTo1">Back</button>
    <button type="button" class="btn-primary" id="toStep3">Save &amp; Continue</button>
  </div>
</section>

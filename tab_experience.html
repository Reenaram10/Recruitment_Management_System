<section class="panel" id="panel3">
  <div class="panel-head">
    <h1>Work Experience</h1>
    <p>Add every academic or industry position you've held, with dates and salary. If you're a fresher, tick the box
      below and skip straight to submitting.</p>
  </div>

  <label class="checkbox-line" id="fresherLine" style="margin-bottom:22px;">
    <input type="checkbox" id="fresherCheck">
    <span>I am a fresher — I have no prior work experience</span>
  </label>

  <div id="experienceSection">
    <div id="experienceWrap"></div>

    <button type="button" class="btn-ghost" id="addExperience">+ Add another experience</button>

    <div class="field" style="max-width:280px; margin-top:22px;">
      <label for="totalExperience">Total Experience</label>
      <input type="text" id="totalExperience" placeholder="Auto-calculated" readonly>
    </div>
  </div>

  <div class="panel-actions">
    <button type="button" class="btn-ghost" id="backTo2">Back</button>
    <button type="button" class="btn-primary" id="toStep4">Save &amp; Continue</button>
  </div>
</section>
